<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="A twelve-house wheel printed in verdigris ink on cream">
  <defs>
    <pattern id="zw-dots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="3.5" cy="3.5" r="1.7" fill="#0b3026" opacity=".14"/>
    </pattern>
    <clipPath id="zw-frame"><rect width="1200" height="720"/></clipPath>
  </defs>
  <g clip-path="url(#zw-frame)">
    <rect width="1200" height="720" fill="#9d2c60"/>
    <g transform="translate(600 360)" fill="#7f1f4f">
      <g id="zw-wedge"><path d="M0 0 L700 -190 L700 190 Z"/></g>
      <use href="#zw-wedge" transform="rotate(60)"/>
      <use href="#zw-wedge" transform="rotate(120)"/>
      <use href="#zw-wedge" transform="rotate(180)"/>
      <use href="#zw-wedge" transform="rotate(240)"/>
      <use href="#zw-wedge" transform="rotate(300)"/>
    </g>
    <g transform="translate(600 360)">
      <circle r="300" fill="#e6ebdf" stroke="#0b3026" stroke-width="10"/>
      <circle r="240" fill="#f1f3ec" stroke="#0b3026" stroke-width="6"/>
      <circle r="120" fill="#7fcbb1" stroke="#0b3026" stroke-width="8"/>
      <g stroke="#0b3026" stroke-width="4">
        <g id="zw-line"><path d="M0 -300 V-120"/></g>
        <use href="#zw-line" transform="rotate(30)"/><use href="#zw-line" transform="rotate(60)"/>
        <use href="#zw-line" transform="rotate(90)"/><use href="#zw-line" transform="rotate(120)"/>
        <use href="#zw-line" transform="rotate(150)"/><use href="#zw-line" transform="rotate(180)"/>
        <use href="#zw-line" transform="rotate(210)"/><use href="#zw-line" transform="rotate(240)"/>
        <use href="#zw-line" transform="rotate(270)"/><use href="#zw-line" transform="rotate(300)"/>
        <use href="#zw-line" transform="rotate(330)"/>
      </g>
      <g fill="#082b22">
        <g id="zw-pip"><circle cx="0" cy="-270" r="8"/></g>
        <use href="#zw-pip" transform="rotate(30)"/><use href="#zw-pip" transform="rotate(60)"/>
        <use href="#zw-pip" transform="rotate(90)"/><use href="#zw-pip" transform="rotate(120)"/>
        <use href="#zw-pip" transform="rotate(150)"/><use href="#zw-pip" transform="rotate(180)"/>
        <use href="#zw-pip" transform="rotate(210)"/><use href="#zw-pip" transform="rotate(240)"/>
        <use href="#zw-pip" transform="rotate(270)"/><use href="#zw-pip" transform="rotate(300)"/>
        <use href="#zw-pip" transform="rotate(330)"/>
      </g>
      <g fill="none" stroke="#3e8c77" stroke-width="7" stroke-linejoin="round">
        <path d="M-84 -84 L104 40 L-16 116 Z"/>
      </g>
      <g stroke="#0b3026" stroke-width="7" stroke-linecap="round">
        <path d="M0 -52 v-34 M0 52 v34 M-52 0 h-34 M52 0 h34"/>
      </g>
      <circle r="16" fill="#0b3026"/>
    </g>
    <g fill="#e6ebdf">
      <circle cx="110" cy="110" r="6"/><circle cx="1090" cy="120" r="6"/>
      <circle cx="120" cy="610" r="6"/><circle cx="1080" cy="600" r="6"/>
    </g>
    <rect width="1200" height="720" fill="url(#zw-dots)"/>
  </g>
</svg>
